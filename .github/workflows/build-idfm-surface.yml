name: Construire les validations bus (réseau de surface)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Générer data/idfm-surface.json
        run: python3 scripts/build_idfm_surface.py
      - name: Publier si le fichier a changé
        run: |
          if git diff --quiet -- data/idfm-surface.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/idfm-surface.json
          git commit -m "Actualiser les validations bus (réseau de surface)"
          git push
